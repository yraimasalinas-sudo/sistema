<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Residencias El Parque - Panel de Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- HEADER / NAVBAR -->
    <header class="bg-slate-900 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg class="w-6 h-6 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
                Residencias El Parque
            </h1>
            <div id="user-info" class="text-sm font-medium flex items-center gap-4">
                <span id="user-display">Cargando...</span>
                <button onclick="logout()" class="text-xs bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded transition">Salir</button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-6">

        <!-- ==================== VISTA PROPIETARIO ==================== -->
        <div id="view-owner" class="hidden space-y-6">
            <!-- Banner Resumen -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Apartamento</p>
                    <p id="owner-apto" class="text-2xl font-bold text-slate-800">-</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Alícuota</p>
                    <p id="owner-alicuota" class="text-2xl font-bold text-slate-800">- %</p>
                </div>
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <p class="text-xs font-semibold text-slate-500 uppercase">Estado de Cuenta</p>
                    <p id="owner-status" class="text-2xl font-bold text-emerald-600">Al día</p>
                </div>
            </div>

            <!-- Detalle de Balance -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                <div>
                    <h3 class="text-lg font-bold text-slate-800">Balance Actual Estimado</h3>
                    <p id="owner-balance-text" class="text-sm text-slate-500">Monto pendiente a la tasa de cambio oficial</p>
                </div>
                <div class="text-right flex items-center gap-4">
                    <div>
                        <p id="owner-balance-usd" class="text-2xl font-extrabold text-slate-900">$0.00 USD</p>
                        <p id="owner-balance-bs" class="text-sm font-semibold text-slate-500">Bs 0.00</p>
                    </div>
                    <button onclick="openOwnerPayModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-semibold text-sm transition shadow-sm">Reportar Pago</button>
                </div>
            </div>

            <!-- Tabla de Historial -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                    <h3 class="font-bold text-slate-800">Mis Pagos Reportados</h3>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-600">
                        <thead class="bg-slate-50 text-slate-500 uppercase text-xs">
                            <tr>
                                <th class="p-3">Fecha</th>
                                <th class="p-3">Concepto</th>
                                <th class="p-3">Monto Reportado</th>
                                <th class="p-3">Equiv. USD</th>
                                <th class="p-3">Referencia</th>
                                <th class="p-3">Estado</th>
                            </tr>
                        </thead>
                        <tbody id="owner-payments-table" class="divide-y divide-slate-100">
                            <!-- Inyectado por JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL REPORTAR PAGO (PROPIETARIO) -->
    <div id="owner-pay-modal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-slate-800 border-b pb-2">Reportar Pago de Condominio</h3>
            <form onsubmit="submitOwnerPayment(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Concepto</label>
                    <select id="rep-concept" required class="w-full border rounded-lg p-2 text-sm">
                        <option value="Cuota Ordinaria">Cuota Ordinaria</option>
                        <option value="Cuota Extraordinaria">Cuota Extraordinaria</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Moneda</label>
                        <select id="rep-currency" required class="w-full border rounded-lg p-2 text-sm">
                            <option value="BS">Bolívares (Bs)</option>
                            <option value="USD">Dólares ($)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Monto Pagado</label>
                        <input type="number" step="0.01" id="rep-amount" required class="w-full border rounded-lg p-2 text-sm" placeholder="0.00">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Referencia / Comprobante</label>
                    <input type="text" id="rep-ref" required class="w-full border rounded-lg p-2 text-sm" placeholder="Nº de Referencia o Zelle ID">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Fecha de Transacción</label>
                    <input type="date" id="rep-date" required class="w-full border rounded-lg p-2 text-sm">
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeOwnerPayModal()" class="px-4 py-2 border rounded-lg text-sm font-semibold text-slate-600 hover:bg-slate-50">Cancelar</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-semibold hover:bg-indigo-700">Enviar Reporte</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // CONFIGURACIÓN SUPABASE
        const SUPABASE_URL = 'https://tu-proyecto.supabase.co';
        const SUPABASE_KEY = 'tu-anon-key';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ESTADO GLOBAL DE LA APLICACIÓN
        let currentUser = null;
        let ownersList = [];
        let expensesList = [];
        let paymentsList = [];
        let bcvRatesList = [];

        // AL CARGAR LA PÁGINA
        window.addEventListener('DOMContentLoaded', async () => {
            // Establecer fecha de hoy por defecto en el modal
            document.getElementById('rep-date').value = new Date().toISOString().split('T')[0];
            await initSession();
        });

        // SIMULACIÓN DE SESIÓN / ROL (Adaptar según Auth real)
        async function initSession() {
            // Para la prueba como Propietario (Apto 1-A):
            currentUser = { role: 'owner', apto: '1-A', name: 'Propietario 1-A' }; 
            
            document.getElementById('user-display').innerText = `${currentUser.name} (Apto ${currentUser.apto})`;
            
            await loadStorage();
        }

        function logout() {
            alert('Cerrando sesión...');
            location.reload();
        }

        // CARGA DE DATOS DESDE SUPABASE
        async function loadStorage() {
            try {
                const { data: owners } = await db.from('owners').select('*');
                const { data: expenses } = await db.from('expenses').select('*');
                const { data: payments } = await db.from('payments').select('*');
                const { data: rates } = await db.from('bcv_rates').select('*');

                ownersList = owners || [];
                expensesList = expenses || [];
                paymentsList = payments || [];
                bcvRatesList = rates || [];

                if (currentUser && currentUser.role === 'owner') {
                    document.getElementById('view-owner').classList.remove('hidden');
                    renderOwnerData();
                }
            } catch (err) {
                console.error('Error cargando información de la BD:', err);
            }
        }

        // RETORNA LA TASA BCV
        function getBcvRateForDate(dateStr) {
            if (!bcvRatesList || bcvRatesList.length === 0) return 36.5; // Tasa por defecto
            const found = bcvRatesList.find(r => r.date === dateStr);
            return found ? parseFloat(found.rate) : parseFloat(bcvRatesList[0].rate || 36.5);
        }

        // RENDERIZAR DATOS DEL PROPIETARIO
        function renderOwnerData() {
            const aptoStr = String(currentUser.apto).trim();
            const myOwnerObj = ownersList.find(o => String(o.apto).trim() === aptoStr) || { alicuota: 0 };
            
            const myAlicuota = Number(myOwnerObj.alicuota || 0);

            // 1. Total Gastos de la residencia en USD
            const totalExpensesUsd = expensesList.reduce((acc, exp) => acc + Number(exp.amount_usd || 0), 0);

            // 2. Cuota que le corresponde pagar según su alícuota
            const myQuotaUsd = totalExpensesUsd * (myAlicuota / 100);

            // 3. Pagos Aprobados/Conciliados del Propietario
            const myApprovedPayments = paymentsList.filter(p => 
                String(p.apto).trim() === aptoStr && 
                (p.status === 'Aprobado' || p.status === 'Conciliado')
            );

            const totalPaidUsd = myApprovedPayments.reduce((acc, p) => {
                return acc + Number(p.amount_usd || p.usd_equiv || 0);
            }, 0);

            // 4. Saldo Neto
            const netBalanceUsd = myQuotaUsd - totalPaidUsd;
            const todayBsRate = getBcvRateForDate(new Date().toISOString().split('T')[0]);
            const netBalanceBs = netBalanceUsd * todayBsRate;

            // Inyectar en DOM
            document.getElementById('owner-apto').innerText = aptoStr;
            document.getElementById('owner-alicuota').innerText = `${myAlicuota.toFixed(2)} %`;

            const statusElem = document.getElementById('owner-status');
            if (netBalanceUsd <= 0.01) {
                statusElem.innerText = 'Solvente';
                statusElem.className = 'text-2xl font-bold text-emerald-600';
            } else {
                statusElem.innerText = 'Pendiente';
                statusElem.className = 'text-2xl font-bold text-amber-600';
            }

            document.getElementById('owner-balance-usd').innerText = `$ ${Math.max(0, netBalanceUsd).toFixed(2)} USD`;
            document.getElementById('owner-balance-bs').innerText = `Bs ${Math.max(0, netBalanceBs).toFixed(2)}`;

            // Renderizar Historial de Pagos
            const myAllPayments = paymentsList.filter(p => String(p.apto).trim() === aptoStr);
            const tbody = document.getElementById('owner-payments-table');
            tbody.innerHTML = '';

            if (myAllPayments.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">No hay pagos registrados.</td></tr>`;
                return;
            }

            myAllPayments.forEach(p => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition';

                const statusColor = p.status === 'Aprobado' || p.status === 'Conciliado' ? 'text-emerald-600 bg-emerald-50' : 
                                   (p.status === 'Rechazado' ? 'text-red-600 bg-red-50' : 'text-amber-600 bg-amber-50');

                tr.innerHTML = `
                    <td class="p-3">${p.date || '-'}</td>
                    <td class="p-3 font-medium text-slate-800">${p.concept || 'Cuota'}</td>
                    <td class="p-3">${p.amount} ${p.method?.includes('Bs') ? 'Bs' : '$'}</td>
                    <td class="p-3 font-semibold text-slate-700">$${Number(p.amount_usd || p.usd_equiv || 0).toFixed(2)}</td>
                    <td class="p-3 font-mono text-xs">${p.ref || '-'}</td>
                    <td class="p-3"><span class="px-2 py-1 rounded-full text-xs font-semibold ${statusColor}">${p.status}</span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // MODAL CONTROL
        function openOwnerPayModal() {
            document.getElementById('owner-pay-modal').classList.remove('hidden');
        }

        function closeOwnerPayModal() {
            document.getElementById('owner-pay-modal').classList.add('hidden');
        }

        // ==================== REPORTE DE PAGO (PROPIETARIO) ====================
        async function submitOwnerPayment(e) {
            e.preventDefault();

            if (!currentUser || currentUser.role !== 'owner') {
                alert("Sesión no válida como propietario.");
                return;
            }

            const apto = String(currentUser.apto).trim();
            const concept = document.getElementById('rep-concept').value;
            const currency = document.getElementById('rep-currency').value; // 'BS' o 'USD'
            const amount = parseFloat(document.getElementById('rep-amount').value) || 0;
            const ref = document.getElementById('rep-ref').value;
            const payDate = document.getElementById('rep-date').value || new Date().toISOString().split('T')[0];

            const type = concept.toLowerCase().includes('extra') ? 'extraordinaria' : 'ordinaria';
            const method = currency === 'BS' ? 'Bs - Pago Móvil / Transferencia' : 'USD - Efectivo / Zelle';

            const bcvRateUsed = getBcvRateForDate(payDate);
            const isBs = currency === 'BS';
            const usdEquiv = isBs ? (amount / bcvRateUsed) : amount;

            const payload = {
                apto: apto,
                concept: concept,
                type: type,
                method: method,
                amount: amount,
                amount_usd: Number(usdEquiv.toFixed(2)),
                usd_equiv: Number(usdEquiv.toFixed(2)),
                bcv_rate_used: isBs ? bcvRateUsed : null,
                ref: ref,
                status: 'Pendiente',
                date: payDate
            };

            try {
                const { error } = await db.from('payments').insert([payload]);

                if (error) {
                    alert('Error al enviar el reporte de pago: ' + error.message);
                    return;
                }

                closeOwnerPayModal();
                alert('¡Pago reportado exitosamente! Queda a la espera de conciliación por el administrador.');
                
                // Limpiar formulario y recargar interfaz
                e.target.reset();
                document.getElementById('rep-date').value = new Date().toISOString().split('T')[0];
                await loadStorage();

            } catch (err) {
                console.error("Error al procesar pago de propietario:", err);
                alert("Ocurrió un error inesperado al enviar el pago.");
            }
        }
    </script>
</body>
</html>
